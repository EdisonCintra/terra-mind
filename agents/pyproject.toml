[project]
name = "agents"
version = "0.1.0"
description = "TerraMind: workflow ADK do incidente (frente do Gustavo)"
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]>=2.13,<3",
    "litellm>=1.84,<1.103",  # 1.103+ exige mcp 2.x; o mcp está em 1.x (contrato 5)
    "mcp>=1.24,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
markers = ["pg: precisa de Docker para subir um Postgres (testcontainers)"]

[tool.ruff]
extend = "../ruff.toml"
