services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: terramind
      POSTGRES_PASSWORD: terramind
      POSTGRES_DB: terramind
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terramind -d terramind"]
      interval: 3s
      timeout: 3s
      retries: 20

  erp-mcp:
    build:
      context: .
      dockerfile: erp_mcp/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://terramind:terramind@postgres:5432/terramind
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy

  painel:
    build:
      context: .
      dockerfile: painel/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://terramind:terramind@postgres:5432/terramind
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  # Frente Edison (Task 17): conhecimento (porta 8010) e monitor (porta 8020)

  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://terramind:terramind@postgres:5432/terramind
      ERP_MCP_URL: http://erp-mcp:8030/mcp
      CONHECIMENTO_URL: http://conhecimento:8010
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      erp-mcp:
        condition: service_started

volumes:
  pgdata:
  qdrantdata:

