services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: terramind
      POSTGRES_PASSWORD: terramind
      POSTGRES_DB: terramind
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terramind -d terramind"]
      interval: 3s
      timeout: 3s
      retries: 20

  erp-mcp:
    build:
      context: .
      dockerfile: erp_mcp/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy

  painel:
    build:
      context: .
      dockerfile: painel/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      AGENTS_URL: http://agents:8000
      MONITOR_URL: http://monitor:8020
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  conhecimento:
    build:
      context: .
      dockerfile: base_agricola/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://terramind:terramind@postgres:5432/terramind
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  # Carga única da base de conhecimento: indexa as bulas no Qdrant e carrega os fatores de perda.
  # Sem ela a busca volta vazia e o Avaliador entende que a bula não traz o limite.
  # Idempotente (upsert): pode rodar de novo a qualquer momento com `docker compose run --rm carga`.
  carga:
    build:
      context: .
      dockerfile: base_agricola/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://terramind:terramind@postgres:5432/terramind
      QDRANT_URL: http://qdrant:6333
    command: >
      sh -c "python -m base_agricola.ingest indexar &&
             python -m base_agricola.ingest carregar-fatores"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://terramind:terramind@postgres:5432/terramind
      AGENTS_URL: http://agents:8000
      MONITOR_MODE: ${MONITOR_MODE:-replay}
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy
      agents:
        condition: service_started

  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://terramind:terramind@postgres:5432/terramind
      ERP_MCP_URL: http://erp-mcp:8030/mcp
      CONHECIMENTO_URL: http://conhecimento:8010
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      erp-mcp:
        condition: service_started
      conhecimento:
        condition: service_started
      carga:
        condition: service_completed_successfully

volumes:
  pgdata:
  qdrantdata:

