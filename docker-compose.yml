services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: terramind
      POSTGRES_PASSWORD: terramind
      POSTGRES_DB: terramind
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terramind -d terramind"]
      interval: 3s
      timeout: 3s
      retries: 20

  erp-mcp:
    build:
      context: .
      dockerfile: erp_mcp/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy

  painel:
    build:
      context: .
      dockerfile: painel/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      AGENTS_URL: http://agents:8000
      MONITOR_URL: http://monitor:8020
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Roda uma vez a cada subida: PDFs → Qdrant e YAML → Postgres. Refazer não duplica.
  conhecimento-carga:
    image: terramind-conhecimento
    build:
      context: .
      dockerfile: base_agricola/Dockerfile
    command: ["sh", "-c", "python -m base_agricola.ingest indexar && python -m base_agricola.ingest carregar-fatores"]
    environment: &ambiente_conhecimento
      DATABASE_URL: postgresql+psycopg://terramind:terramind@postgres:5432/terramind
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  conhecimento:
    image: terramind-conhecimento
    environment: *ambiente_conhecimento
    ports:
      - "8010:8010"
    depends_on:
      conhecimento-carga:
        condition: service_completed_successfully

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://terramind:terramind@postgres:5432/terramind
      AGENTS_URL: http://agents:8000
      MONITOR_MODE: ${MONITOR_MODE:-replay}
      MONITOR_INTERVAL_MIN: ${MONITOR_INTERVAL_MIN:-30}
      LIMIAR_CHUVA_MM: ${LIMIAR_CHUVA_MM:-20}
      LIMIAR_VENTO_KMH: ${LIMIAR_VENTO_KMH:-15}
      LIMIAR_UMIDADE_MIN_PCT: ${LIMIAR_UMIDADE_MIN_PCT:-50}
      JANELA_RISCO_H: ${JANELA_RISCO_H:-48}
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy
      agents:
        condition: service_started

  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://terramind:terramind@postgres:5432/terramind
      ERP_MCP_URL: http://erp-mcp:8030/mcp
      CONHECIMENTO_URL: http://conhecimento:8010
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      erp-mcp:
        condition: service_started
      conhecimento:
        condition: service_started

volumes:
  pgdata:
  qdrantdata:

