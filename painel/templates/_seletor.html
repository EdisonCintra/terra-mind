<div class="seletor">
  {% for i in incidentes %}
  <a href="/incidente/{{ i.id }}" data-id="{{ i.id }}" class="{{ 'ativa' if i.id == escolhido }}" data-criado="{{ i.criado_em.isoformat() if i.criado_em else '' }}" data-status="{{ i.status }}" data-talhao="{{ i.talhao_id }}" data-origem="{{ i.origem or 'live' }}">
    INC-{{ "%04d"|format(i.id) }} · {{ i.talhao }} · {{ STATUS_INCIDENTE.get(i.status, i.status) }}
  </a>
  {% endfor %}
</div>
