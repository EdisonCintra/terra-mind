<div class="seletor">
  {% for i in incidentes %}
  <a href="/timeline?incidente={{ i.id }}" data-id="{{ i.id }}" class="{{ 'ativa' if i.id == escolhido }}" data-criado="{{ i.criado_em.isoformat() if i.criado_em else '' }}" data-status="{{ i.status }}">
    INC-{{ "%04d"|format(i.id) }} · {{ i.talhao }} · {{ STATUS_INCIDENTE.get(i.status, i.status) }}
  </a>
  {% endfor %}
</div>
