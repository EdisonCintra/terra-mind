[project]
name = "terramind"
version = "0.1.0"
description = "TerraMind: agente que protege operações agrícolas de eventos climáticos extremos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp[cli]>=1.24,<2",
    "psycopg[binary]>=3.3.6",
    "python-telegram-bot>=22.8",
    "fastembed>=0.9.1",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=2.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    # agents (frente do Gustavo)
    "google-adk[db]>=2.13,<3",
    "litellm>=1.84,<1.103",  # 1.103+ exige mcp 2.x; o mcp está em 1.x (contrato 4)
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.29",
    "tzdata>=2024.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["pg: precisa de Docker para subir um Postgres (testcontainers)"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]
