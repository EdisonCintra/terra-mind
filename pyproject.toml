[project]
name = "terramind"
version = "0.1.0"
description = "TerraMind: agente que protege operações agrícolas de eventos climáticos extremos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "psycopg[binary]>=3.3.6",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]
